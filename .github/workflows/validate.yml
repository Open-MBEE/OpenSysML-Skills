name: validate

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate-skills.py
      - run: python3 scripts/check-links.py
